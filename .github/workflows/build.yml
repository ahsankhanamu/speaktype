name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-widget:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/widget-rust/src-tauri
    steps:
      - uses: actions/checkout@v4

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/widget-rust/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli

      - name: Compile check
        run: cargo check
