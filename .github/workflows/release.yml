name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-widget:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/widget-rust/src-tauri

      - name: Install cmake
        run: brew install cmake

      - name: Build whisper.cpp sidecar
        run: |
          WHISPER_SRC="apps/widget-rust/src-tauri/scripts/build/whisper.cpp"
          SIDECAR_BUILD="$WHISPER_SRC/build"
          if [ ! -d "$WHISPER_SRC" ]; then
            mkdir -p "$(dirname "$WHISPER_SRC")"
            git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git "$WHISPER_SRC"
          fi
          mkdir -p "$SIDECAR_BUILD"
          cd "$SIDECAR_BUILD"
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON -DGGML_NATIVE=OFF ..
          cmake --build . --target whisper-server -j"$(sysctl -n hw.ncpu)"
          mkdir -p "$GITHUB_WORKSPACE/apps/widget-rust/src-tauri/binaries"
          cp bin/whisper-server "$GITHUB_WORKSPACE/apps/widget-rust/src-tauri/binaries/whisper-server-aarch64-apple-darwin"

      - name: Install tauri-cli
        run: cargo install tauri-cli

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build signed .dmg
        working-directory: apps/widget-rust
        run: cargo tauri build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/widget-rust/src-tauri/target/release/bundle/dmg/*.dmg

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/whisper-server:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}/whisper-server:latest
