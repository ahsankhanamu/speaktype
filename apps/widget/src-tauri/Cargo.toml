[package]
name = "speaktype"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "devtools", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "blocking"] }
cpal = "0.15"
arboard = "3"
futures-util = "0.3.32"
tauri-plugin-shell = "2.3.5"
scopeguard = "1.2"
flate2 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSPanel", "NSResponder"] }
objc2-foundation = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
