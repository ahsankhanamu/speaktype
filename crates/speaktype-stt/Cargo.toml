[package]
name = "speaktype-stt"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
bytes = "1"
keyring = { version = "3", features = ["apple-native"], optional = true }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }

[features]
# The macOS Keychain store. Phones turn it off and pass their own SecretStore.
default = ["keychain"]
keychain = ["dep:keyring"]

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["time", "rt", "macros", "test-util", "net"] }
