<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakType</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/widget.css">
</head>
<body>
  <div id="widget-root" class="widget-root">
  <div id="ready-card" class="ready-card hidden">
    <button class="ready-close" id="ready-close" title="Dismiss" aria-label="Dismiss">×</button>
    <p class="ready-title">You're all set</p>
    <p class="ready-hint" id="ready-hint">Click the mic to start dictating</p>
  </div>
  <svg id="ready-connector" class="ready-connector hidden" viewBox="0 0 28 12" aria-hidden="true">
    <defs>
      <marker id="ready-arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="currentColor"/>
      </marker>
    </defs>
    <line class="ready-connector-line" x1="1" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ready-arrowhead)"/>
  </svg>
  <div class="widget-shell" id="widget-shell">
    <div class="beacon-rings hidden" id="beacon-rings" aria-hidden="true">
      <span class="beacon-ring"></span>
      <span class="beacon-ring beacon-ring--delay"></span>
    </div>
    <div id="widget" class="widget idle">
    <div class="state-idle">
      <div class="icon-container">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <span class="perm-warning" id="permWarning" title="Permissions needed"></span>
        <span class="server-status" id="serverStatus" title="Server starting..."></span>
      </div>
    </div>
    <div class="state-recording">
      <button type="button" class="rec-btn rec-cancel" id="rec-cancel" title="Cancel" aria-label="Cancel recording">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M6 6l12 12M18 6l-12 12"/>
        </svg>
      </button>
      <div class="waveform" aria-hidden="true">
        <canvas id="wave-canvas" class="wave-canvas" width="136" height="30"></canvas>
      </div>
      <span class="timer">0.0s</span>
      <button type="button" class="rec-btn rec-stop" id="rec-stop" title="Stop and transcribe" aria-label="Stop recording">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>
    </div>
    <div class="state-transcribing">
      <div class="dots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <div class="state-success">
      <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <div class="state-error">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6l-12 12"/>
      </svg>
    </div>
  </div>
  </div>
  </div>

  <div id="welcome-overlay" class="welcome-overlay" style="display:none">
    <div class="welcome-card">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <h2>Welcome to SpeakType</h2>
      <p class="welcome-desc">Push-to-talk voice typing that works everywhere.</p>

      <div class="permission-step" id="perm-step-mic">
        <div class="step-status" id="step-mic-status">1</div>
        <div class="step-content">
          <div class="step-title">Microphone Access</div>
          <div class="step-desc" id="step-mic-desc">Required for recording your voice</div>
        </div>
      </div>

      <div class="permission-step" id="perm-step-acc">
        <div class="step-status" id="step-acc-status">2</div>
        <div class="step-content">
          <div class="step-title">Accessibility Access</div>
          <div class="step-desc" id="step-acc-desc">Required for pasting text into other apps</div>
        </div>
      </div>

      <button class="welcome-btn" id="welcome-got-it" style="display:none">Got it!</button>
    </div>
  </div>

  <script src="scripts/theme.js"></script>
  <script src="scripts/format.js"></script>
  <script src="scripts/waveform.js"></script>
  <script>
    function getInvoke() {
      if (window.__TAURI__ && window.__TAURI__.core) return window.__TAURI__.core.invoke;
      if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) return window.__TAURI_INTERNALS__.invoke;
      return null;
    }
    function getListen() {
      if (window.__TAURI__ && window.__TAURI__.event) return window.__TAURI__.event.listen;
      if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.listen) return window.__TAURI_INTERNALS__.listen;
      return null;
    }

    const ttipc = {
      invoke(cmd, args) {
        const fn = getInvoke();
        if (!fn) { console.warn('[ipc] No invoke for:', cmd); return Promise.resolve(); }
        return fn(cmd, args);
      },
      listen(eventName, callback) {
        const fn = getListen();
        if (!fn) { console.warn('[ipc] No listen for:', eventName); return Promise.resolve(); }
        return fn(eventName, callback);
      },
      toggleRecording(isRecording) { return this.invoke('toggle_recording', { isRecording }); },
      cancelRecording() { return this.invoke('cancel_recording'); },
      openSettings() { return this.invoke('open_settings'); },
      openOnboarding() { return this.invoke('open_onboarding'); },
      onboardingStatus() { return this.invoke('get_onboarding_status'); },
      requestAccessibility() { return this.invoke('request_accessibility'); },
      openSystemPane(pane) { return this.invoke('open_system_pane', { pane }); },
    };

    const BEACON_RING_EXTRA = 28;
    const SHELL_VERT_SLACK = 14;
    const READY_PAD_X = 24;
    const READY_PAD_Y = 16;
    const READY_MIN_W = 260;
    const READY_MIN_H = 72;
    const IDLE_SHELL_W = 48;
    const ACTIVE_SHELL_W = 272;
    const LEVEL_AMP = 15;
    const PEAK_AMP = 6;
    const LEVEL_SMOOTH = 0.11;
    const LEVEL_WRITE_EPS = 0.02;
    const DEFAULT_FLASH_MS = 1500;
    const DRAG_THRESHOLD = 5;
    const OVERLAY_DISMISS_MS = 3000;
    const CRASH_FLASH_MS = 3000;
    const SERVER_READY_DISMISS_MS = 3000;
    const LOCATE_HIGHLIGHT_MS = 2500;
    const GUIDE_READY_MS = 10000;
    const STATUS_POLL_MS = 2000;

    const widgetRoot = document.getElementById('widget-root');
    const beaconRings = document.getElementById('beacon-rings');
    const readyCard = document.getElementById('ready-card');
    const readyConnector = document.getElementById('ready-connector');
    const readyHint = document.getElementById('ready-hint');
    const readyClose = document.getElementById('ready-close');
    const widgetShell = document.getElementById('widget-shell');
    const widget = document.getElementById('widget');
    const timer = document.querySelector('.timer');
    const recCancel = document.getElementById('rec-cancel');
    const recStop = document.getElementById('rec-stop');
    const overlay = document.getElementById('welcome-overlay');
    let currentState = 'idle';
    let permissionsMissing = false;
    let beaconActive = false;
    let readyVisible = false;
    let readyDismissed = false;
    let onboardingSessionActive = false;
    let readyGuideTimer = null;
    let statusPollInterval = null;
    let setupComplete = false;
    let locateHighlightActive = false;
    let recordingStart = 0;
    let waveAnimFrame = null;
    let targetLevel = 0;
    let lastWindowWidth = IDLE_SHELL_W + 24;
    let lastWindowHeight = 0;
    const waveform = new WaveformRenderer(document.getElementById('wave-canvas'));
    let resizeSeq = Promise.resolve();

    async function setWindowSizeKeepRightEdge(w, h) {
      resizeSeq = resizeSeq.then(() => setWindowSizeKeepRightEdgeImpl(w, h));
      return resizeSeq;
    }

    async function setWindowSizeKeepRightEdgeImpl(w, h) {
      if (w === lastWindowWidth && h === lastWindowHeight) return;

      const tauriWin = window.__TAURI__ && window.__TAURI__.window;
      if (!tauriWin) {
        setWindowSize(w, h);
        lastWindowWidth = w;
        lastWindowHeight = h;
        return;
      }
      try {
        const win = tauriWin.getCurrentWindow();
        const delta = w - lastWindowWidth;
        if (delta !== 0) {
          const scale = await win.scaleFactor();
          const pos = await win.outerPosition();
          await win.setPosition(new window.__TAURI__.dpi.PhysicalPosition(
            Math.round(pos.x - delta * scale),
            pos.y
          ));
        }
        await win.setSize(new window.__TAURI__.dpi.LogicalSize(w, h));
        lastWindowWidth = w;
        lastWindowHeight = h;
      } catch (e) {
        setWindowSize(w, h);
        lastWindowWidth = w;
        lastWindowHeight = h;
      }
    }

    function setWindowSize(w, h) {
      if (window.__TAURI__ && window.__TAURI__.window) {
        const win = window.__TAURI__.window.getCurrentWindow();
        win.setSize(new window.__TAURI__.dpi.LogicalSize(w, h)).catch(() => {});
      } else {
        ttipc.invoke('plugin:window|set_size', {
          label: 'main',
          value: { type: 'Logical', data: { width: w, height: h } },
        }).catch(() => {});
      }
    }

    let rootPaddingCache = null;

    function rootPadding() {
      if (!rootPaddingCache) {
        const s = getComputedStyle(widgetRoot);
        rootPaddingCache = {
          x: parseFloat(s.paddingLeft) + parseFloat(s.paddingRight),
          y: parseFloat(s.paddingTop) + parseFloat(s.paddingBottom),
        };
      }
      return rootPaddingCache;
    }

    async function fitWindowToContent() {
      await waitForLayout();

      if (readyVisible && !readyCard.classList.contains('hidden')) {
        await fitReadyWindow();
        return;
      }

      const pad = rootPadding();
      const shellW = widgetShell.offsetWidth || IDLE_SHELL_W;
      const shellH = widgetShell.offsetHeight || IDLE_SHELL_W;
      const showBeaconRipple =
        currentState === 'idle' && (beaconActive || locateHighlightActive);

      let contentW = shellW;
      let contentH = shellH + SHELL_VERT_SLACK * 2;
      if (showBeaconRipple) {
        contentW = shellW + BEACON_RING_EXTRA;
        contentH = Math.max(contentH, shellH + BEACON_RING_EXTRA * 2);
      }
      if (currentState === 'recording') {
        contentH = Math.max(contentH, shellH + 40);
      }

      const w = Math.ceil(contentW + pad.x);
      const h = Math.ceil(contentH + pad.y);

      await setWindowSizeKeepRightEdge(w, h);
    }

    function syncWindowSize() {
      fitWindowToContent().catch(() => {});
    }

    async function initWidgetLayout() {
      const tauriWin = window.__TAURI__ && window.__TAURI__.window;
      if (tauriWin) {
        try {
          const win = tauriWin.getCurrentWindow();
          const size = await win.innerSize();
          const scale = await win.scaleFactor();
          lastWindowWidth = Math.round(size.width / scale);
          lastWindowHeight = Math.round(size.height / scale);
        } catch (e) {
          lastWindowWidth = IDLE_SHELL_W + 24;
          lastWindowHeight = 0;
        }
      }
      syncWindowSize();
    }

    function syncBeaconVisuals() {
      const show = beaconActive && currentState === 'idle';
      widget.classList.toggle('beacon', show);
      widgetRoot.classList.toggle('beacon-active', show);
      beaconRings.classList.toggle('hidden', !show);
      syncWindowSize();
    }

    function setBeacon(on) {
      beaconActive = on;
      syncBeaconVisuals();
    }

    function waitForLayout() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });
    }

    function clearBeaconVisuals() {
      beaconActive = false;
      widget.classList.remove('beacon', 'locate');
      widgetRoot.classList.remove('beacon-active');
      beaconRings.classList.add('hidden');
    }

    async function fitReadyWindow() {
      await waitForLayout();
      if (readyCard.classList.contains('hidden')) return;

      const shellW = widgetShell.offsetWidth || 48;
      const cardW = readyCard.offsetWidth || 168;
      const connW = readyConnector.classList.contains('hidden') ? 0 : (readyConnector.offsetWidth || 28);
      const gaps = 12;
      const rootPad = 24;
      const w = cardW + connW + shellW + gaps + rootPad + READY_PAD_X;
      const h = Math.max(readyCard.offsetHeight, shellW) + READY_PAD_Y;

      await setWindowSizeKeepRightEdge(
        Math.max(w, READY_MIN_W),
        Math.max(h, READY_MIN_H)
      );
    }

    async function showReadyTooltip(hotkey) {
      readyDismissed = false;
      readyVisible = true;
      clearBeaconVisuals();
      readyHint.textContent = 'Click the mic or press ' + formatHotkey(hotkey, { compact: true });
      widgetRoot.classList.add('ready');
      readyCard.classList.remove('hidden');
      readyConnector.classList.remove('hidden');
      await fitReadyWindow();
      clearTimeout(readyGuideTimer);
      readyGuideTimer = setTimeout(() => dismissReady(), GUIDE_READY_MS);
    }

    function dismissReady() {
      readyDismissed = true;
      readyVisible = false;
      readyCard.classList.add('hidden');
      readyConnector.classList.add('hidden');
      widgetRoot.classList.remove('ready');
      clearTimeout(readyGuideTimer);
      syncWindowSize();
    }

    async function maybeShowReadyGuide() {
      if (readyDismissed || readyVisible) return;
      try {
        const s = await ttipc.invoke('get_onboarding_status');
        if (!s?.microphone || !s?.accessibility || !s?.model) return;
        const settings = await ttipc.invoke('get_settings');
        await showReadyTooltip(settings?.hotkey || 'Super+Control');
      } catch (e) {
        console.error('[ready] guide error:', e);
      }
    }

    readyClose.onclick = (e) => {
      e.stopPropagation();
      dismissReady();
    };

    function syncPermissionState(mic, acc) {
      const warn = document.getElementById('permWarning');
      permissionsMissing = !mic || !acc;
      warn.style.display = permissionsMissing ? 'block' : 'none';
    }

    async function runStatusPoll() {
      if (currentState === 'recording' || currentState === 'transcribing') return;

      let s;
      try {
        s = await ttipc.onboardingStatus();
      } catch (e) {
        console.error('[status] poll error:', e);
        return;
      }
      if (!s) return;

      const mic = !!s.microphone;
      const acc = !!s.accessibility;
      const overlayVisible = overlay.style.display !== 'none';
      syncPermissionState(mic, acc);
      if (overlayVisible) updatePermissionOverlay(mic, acc);

      const allDone = mic && acc && !!s.model;
      if (!readyVisible && !readyDismissed) {
        if (allDone && !onboardingSessionActive) {
          setBeacon(false);
        } else {
          onboardingSessionActive = onboardingSessionActive || !allDone;
          setBeacon(true);
        }
      }

      setupComplete = allDone && !onboardingSessionActive;
      if (setupComplete && !overlayVisible) stopStatusPolling();
    }

    function startStatusPolling() {
      if (statusPollInterval) return;
      runStatusPoll();
      statusPollInterval = setInterval(runStatusPoll, STATUS_POLL_MS);
    }

    function stopStatusPolling() {
      if (statusPollInterval) {
        clearInterval(statusPollInterval);
        statusPollInterval = null;
      }
    }

    function resumeStatusPolling() {
      setupComplete = false;
      startStatusPolling();
    }

    function setState(s) {
      currentState = s;
      widget.className = 'widget ' + s;
      if (s === 'recording' || s === 'transcribing') {
        dismissReady();
        widget.classList.remove('beacon', 'locate');
        widgetRoot.classList.remove('beacon-active');
        beaconRings.classList.add('hidden');
        stopStatusPolling();
      } else {
        syncBeaconVisuals();
        if (!setupComplete) startStatusPolling();
      }
      syncWindowSize();
    }

    function startTimer() {
      recordingStart = Date.now();
      lastTimerText = '0.0s';
      timer.textContent = lastTimerText;
    }

    let smoothedLevel = 0;
    let writtenLevel = -1;
    let lastTimerText = '';

    function resetWaveform() {
      targetLevel = 0;
      smoothedLevel = 0;
      writtenLevel = 0;
      widget.style.setProperty('--level', '0');
      waveform.reset();
    }

    function setTargetLevel(rms, peak) {
      targetLevel = Math.min(rms * LEVEL_AMP, 1);
      waveform.setLevel(Math.min(peak * PEAK_AMP, 1));
    }

    function tickWaveform(ts) {
      if (currentState !== 'recording') {
        waveAnimFrame = null;
        return;
      }

      smoothedLevel += (targetLevel - smoothedLevel) * LEVEL_SMOOTH;
      if (Math.abs(smoothedLevel - writtenLevel) > LEVEL_WRITE_EPS) {
        writtenLevel = smoothedLevel;
        widget.style.setProperty('--level', smoothedLevel.toFixed(3));
      }

      waveform.frame(ts);

      const elapsed = (Date.now() - recordingStart) / 1000;
      const text = elapsed >= 60
        ? formatDuration(elapsed)
        : elapsed.toFixed(1) + 's';
      if (text !== lastTimerText) {
        lastTimerText = text;
        timer.textContent = text;
      }

      waveAnimFrame = requestAnimationFrame(tickWaveform);
    }

    function startWaveformLoop() {
      if (!waveAnimFrame) waveAnimFrame = requestAnimationFrame(tickWaveform);
    }

    function stopWaveformLoop() {
      if (waveAnimFrame) {
        cancelAnimationFrame(waveAnimFrame);
        waveAnimFrame = null;
      }
      resetWaveform();
    }

    function flashState(s, ms) {
      setState(s);
      setTimeout(() => setState('idle'), ms || DEFAULT_FLASH_MS);
    }

    let locateTimer = null;

    function highlightWidget(ms) {
      const duration = ms || LOCATE_HIGHLIGHT_MS;
      locateHighlightActive = true;
      widget.classList.add('locate');
      widgetRoot.classList.add('beacon-active');
      beaconRings.classList.remove('hidden');
      syncWindowSize();
      clearTimeout(locateTimer);
      locateTimer = setTimeout(() => {
        locateHighlightActive = false;
        widget.classList.remove('locate');
        if (!beaconActive) {
          widgetRoot.classList.remove('beacon-active');
          beaconRings.classList.add('hidden');
        }
        syncWindowSize();
      }, duration);
    }

    let _dragState = null;

    function startDragTracking(e, source) {
      if (e.button !== 0) return;
      if (source === 'widget') {
        if (currentState === 'transcribing') return;
        _dragState = { x: e.screenX, y: e.screenY, dragging: false, source: 'widget' };
        return;
      }
      if (currentState === 'recording' || currentState === 'transcribing') return;
      _dragState = { x: e.screenX, y: e.screenY, dragging: false, source };
    }

    function bindDragSurface(el, { source, ignoreSelector } = {}) {
      if (!el) return;
      el.addEventListener('mousedown', (e) => {
        if (ignoreSelector && e.target.closest(ignoreSelector)) return;
        startDragTracking(e, source);
      });
    }

    bindDragSurface(widgetShell, { source: 'widget', ignoreSelector: '.rec-btn' });
    bindDragSurface(readyCard, { source: 'ready', ignoreSelector: '.ready-close' });
    bindDragSurface(readyConnector, { source: 'ready' });

    document.addEventListener('mousemove', (e) => {
      if (!_dragState || _dragState.dragging) return;
      if (currentState === 'recording') return;
      const dx = e.screenX - _dragState.x;
      const dy = e.screenY - _dragState.y;
      if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
        _dragState.dragging = true;
        if (window.__TAURI__ && window.__TAURI__.window) {
          window.__TAURI__.window.getCurrentWindow().startDragging().catch(() => {});
        } else {
          ttipc.invoke('plugin:window|start_dragging', { label: 'main' }).catch(() => {});
        }
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (!_dragState) return;
      const wasDrag = _dragState.dragging;
      const source = _dragState.source;
      _dragState = null;
      if (wasDrag) {
        ttipc.invoke('save_window_position').catch(() => {});
        return;
      }

      if (source !== 'widget') return;

      if (currentState === 'transcribing') return;

      if (currentState === 'recording') return;

      if (permissionsMissing) {
        ttipc.openOnboarding();
      } else {
        ttipc.toggleRecording(currentState === 'recording').catch(e2 => console.error('[toggle] error:', e2));
      }
    });

    widget.addEventListener('contextmenu', (e) => { e.preventDefault(); ttipc.openSettings().catch(() => {}); });

    recStop.onclick = (e) => {
      e.stopPropagation();
      if (currentState !== 'recording') return;
      ttipc.toggleRecording(true).catch(e2 => console.error('[stop] error:', e2));
    };

    recCancel.onclick = (e) => {
      e.stopPropagation();
      if (currentState !== 'recording') return;
      ttipc.cancelRecording().catch(e2 => console.error('[cancel] error:', e2));
    };

    function updatePermissionOverlay(micOk, accOk) {
      const micStep = document.getElementById('perm-step-mic');
      const accStep = document.getElementById('perm-step-acc');
      const micStatus = document.getElementById('step-mic-status');
      const accStatus = document.getElementById('step-acc-status');
      const micDesc = document.getElementById('step-mic-desc');
      const accDesc = document.getElementById('step-acc-desc');
      const gotIt = document.getElementById('welcome-got-it');

      if (!micOk) {
        micStatus.textContent = '!';
        micStatus.className = 'step-status step-pending';
        micDesc.textContent = 'Click to open System Settings';
        micStep.style.display = '';
        micStep.classList.add('clickable');
        micStep.onclick = () => ttipc.openSystemPane('com.apple.preference.security?Privacy_Microphone');
      } else {
        micStatus.textContent = '\u2713';
        micStatus.className = 'step-status step-done';
        micDesc.textContent = 'Microphone access granted';
        micStep.classList.remove('clickable');
        micStep.onclick = null;
      }

      if (!accOk) {
        accStatus.textContent = '!';
        accStatus.className = 'step-status step-pending';
        accDesc.textContent = 'Click to open System Settings';
        accStep.style.display = '';
        accStep.classList.add('clickable');
        accStep.onclick = () => ttipc.openSystemPane('com.apple.preference.security?Privacy_Accessibility');
      } else {
        accStatus.textContent = '\u2713';
        accStatus.className = 'step-status step-done';
        accDesc.textContent = 'Accessibility access granted';
        accStep.classList.remove('clickable');
        accStep.onclick = null;
      }

      if (micOk && accOk) {
        gotIt.style.display = '';
        gotIt.textContent = 'Done';
        gotIt.onclick = () => { overlay.style.display = 'none'; };
        setTimeout(() => { overlay.style.display = 'none'; }, OVERLAY_DISMISS_MS);
      } else {
        gotIt.style.display = '';
        gotIt.textContent = 'Open Settings';
        gotIt.onclick = () => { ttipc.openSettings(); overlay.style.display = 'none'; };
      }
    }

    const listenFn = getListen();
    if (listenFn) {
      const L = (ev, fn) => ttipc.listen(ev, fn);
      L('sidecar:ready', () => console.log('[sidecar] ready'));
      L('sidecar:recording_started', () => {
        setState('recording');
        startTimer();
        startWaveformLoop();
      });
      L('sidecar:audio_level', (e) => {
        if (currentState !== 'recording') return;
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        const level = d.level || 0;
        setTargetLevel(level, typeof d.peak === 'number' ? d.peak : level);
      });
      L('sidecar:recording_stopped', () => {
        stopWaveformLoop();
      });
      L('sidecar:recording_cancelled', () => {
        stopWaveformLoop();
        setState('idle');
      });
      L('sidecar:transcribing', () => {
        stopWaveformLoop();
        setState('transcribing');
      });
      L('sidecar:long_audio', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        console.log('[widget] Long audio detected:', d.duration_secs, 's');
      });
      L('sidecar:pasted', (e) => { flashState('success'); });
      L('sidecar:no_speech', () => { stopWaveformLoop(); flashState('error'); });
      L('sidecar:busy', () => { stopWaveformLoop(); flashState('error'); });
      L('sidecar:error', (e) => { stopWaveformLoop(); flashState('error'); });
      L('sidecar:crashed', () => { stopWaveformLoop(); flashState('error', CRASH_FLASH_MS); });
      L('sidecar:permissions', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        syncPermissionState(!!d.microphone, !!d.accessibility);
        if (permissionsMissing) resumeStatusPolling();
      });
      L('sidecar:device_changed', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        console.log('[device] changed:', d.name, 'inputs:', d.count);
      });

      const serverDot = document.getElementById('serverStatus');
      L('server:starting', () => {
        serverDot.className = 'server-status starting';
        serverDot.title = 'Server starting...';
        serverDot.style.display = 'block';
      });
      L('server:ready', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        serverDot.className = 'server-status ready';
        serverDot.title = 'Server ready (port ' + (d.port || '?') + ')';
        setTimeout(() => { serverDot.style.display = 'none'; }, SERVER_READY_DISMISS_MS);
      });
      L('server:error', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        serverDot.className = 'server-status error';
        serverDot.title = 'Server error: ' + (d.reason || 'unknown');
        serverDot.style.display = 'block';
      });
      L('widget:highlight', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : (e.payload || {});
        highlightWidget(d.duration_ms);
      });
      L('onboarding:opened', () => {
        onboardingSessionActive = true;
        setBeacon(true);
        resumeStatusPolling();
      });
      L('onboarding:finished', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : (e.payload || {});
        onboardingSessionActive = false;
        stopStatusPolling();
        showReadyTooltip(d.hotkey || 'Super+Control');
      });
      L('sidecar:onboarding_required', () => {
        onboardingSessionActive = true;
        setBeacon(true);
        resumeStatusPolling();
      });

    } else {
      console.warn('[widget] No Tauri event API');
    }

    startStatusPolling();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopStatusPolling();
      } else if (setupComplete) {
        runStatusPoll();
      } else {
        startStatusPolling();
      }
    });

    if (typeof ResizeObserver !== 'undefined') {
      let resizeFrame = null;
      const resizeObserver = new ResizeObserver(() => {
        if (resizeFrame) return;
        resizeFrame = requestAnimationFrame(() => {
          resizeFrame = null;
          syncWindowSize();
        });
      });
      resizeObserver.observe(widgetShell);
      resizeObserver.observe(readyCard);
    }

    initWidgetLayout().then(() => {
      setTimeout(maybeShowReadyGuide, 500);
    });
    console.log('[widget] loaded');
  </script>
</body>
</html>
