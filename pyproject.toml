[project]
name = "speaktype"
version = "1.0.0"
description = "Push-to-talk voice typing for your terminal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "faster-whisper>=0.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
client = [
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "requests>=2.28.0",
    "pyautogui>=0.9.53; sys_platform != 'linux'",
    "torch>=2.0.0",
]
assets = [
    "pillow>=10.0.0",
]
mac-dmg = [
    "dmgbuild>=1.0.0; sys_platform == 'darwin'",
]
all = [
    "speaktype[client]",
    "speaktype[assets]",
    "speaktype[mac-dmg]",
    "faster-whisper>=0.10.0",
]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[project.scripts]
speaktype = "cli.speaktype:main"
speaktype-server = "server.whisper_server:main"

[tool.setuptools.package-dir]
"" = "packages/python"

[tool.setuptools.packages.find]
where = ["packages/python"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
