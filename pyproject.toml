[project]
name = "speaktype"
version = "1.0.0"
description = "Push-to-talk voice typing for your terminal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

# Base dependencies — transcription server (packages/server/whisper_server.py)
dependencies = [
    "numpy>=1.24.0",
    "faster-whisper>=0.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
# Client dependencies (packages/cli/speaktype.py — mic, keyboard, display on host)
client = [
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "requests>=2.28.0",
    "pyautogui>=0.9.53; sys_platform != 'linux'",
    "torch>=2.0.0",
]
# Everything — server + client + local whisper
all = [
    "speaktype[client]",
    "faster-whisper>=0.10.0",
]
# GPU acceleration (NVIDIA)
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
