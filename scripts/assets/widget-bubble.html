<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpeakType Widget Bubble</title>
  <link rel="stylesheet" href="../../packages/widget-ui/styles/widget.css">
  <style>
    .snapshot .widget,
    .snapshot .check-icon,
    .snapshot .error-icon,
    .snapshot .dot,
    .snapshot .waveform::before {
      animation: none !important;
    }
    .snapshot .check-icon,
    .snapshot .error-icon {
      stroke-dashoffset: 0 !important;
    }

    .snapshot .dots-wave .dot:nth-child(1) {
      opacity: 1;
      transform: scale(1.3);
    }
    .snapshot .dots-wave .dot:nth-child(2) {
      opacity: 0.65;
      transform: scale(1.05);
    }
    .snapshot .dots-wave .dot:nth-child(3) {
      opacity: 0.3;
      transform: scale(0.8);
    }

    .snapshot .widget.glow-medium.success {
      box-shadow:
        0 0 20px rgba(74, 222, 128, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .snapshot .widget.glow-medium.error {
      box-shadow:
        0 0 18px rgba(248, 113, 60, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    html, body {
      width: 240px;
      height: 120px;
      background: transparent;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 56px;
    }
  </style>
</head>
<body class="snapshot">
  <div class="stage">
    <div id="widget" class="widget idle">
      <div class="state-idle">
        <div class="icon-container">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </div>
      </div>
      <div class="state-recording">
        <div class="waveform">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <span class="timer">4.2s</span>
      </div>
      <div class="state-transcribing">
        <div id="dots" class="dots dots-wave">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
      <div class="state-success">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12.75l6 6 9-13.5"/>
        </svg>
      </div>
      <div class="state-error">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round">
          <path d="M6 6l12 12M18 6l-12 12"/>
        </svg>
      </div>
    </div>
  </div>
  <script>
    const BAR_MIN_H = 4;
    const BAR_AMP = 24;
    const barWeights = [0.4, 0.55, 0.75, 0.9, 1.0, 0.9, 0.75, 0.55, 0.4];
    const jitter = 0.85;
    const RECORDING_LEVEL = 0.735;

    const params = new URLSearchParams(location.search);
    const state = params.get('state') || 'idle';
    const widget = document.getElementById('widget');

    widget.className = 'widget ' + state;

    if (state === 'recording') {
      widget.style.setProperty('--level', String(RECORDING_LEVEL));
      document.querySelectorAll('.bar').forEach((bar, i) => {
        const h = BAR_MIN_H + BAR_AMP * RECORDING_LEVEL * barWeights[i] * jitter;
        bar.style.height = Math.round(h) + 'px';
      });
    }

    if (state === 'success') {
      const check = document.querySelector('.check-icon');
      if (check) check.style.stroke = '#4ade80';
      widget.classList.add('glow-medium');
    }

    if (state === 'error') {
      const x = document.querySelector('.error-icon');
      if (x) x.style.stroke = '#ef4444';
      widget.classList.add('glow-medium');
    }
  </script>
</body>
</html>
