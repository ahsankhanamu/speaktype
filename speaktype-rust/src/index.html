<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakType</title>
  <link rel="stylesheet" href="styles/widget.css">
</head>
<body>
  <div id="widget" class="widget idle">
    <div class="state-idle">
      <div class="icon-container">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <span class="perm-warning" id="permWarning" title="Permissions needed"></span>
        <span class="server-status" id="serverStatus" title="Server starting..."></span>
      </div>
    </div>
    <div class="state-recording">
      <div class="waveform">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </div>
      <span class="timer">0.0s</span>
    </div>
    <div class="state-transcribing">
      <div class="dots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <div class="state-success">
      <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <div class="state-error">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6l-12 12"/>
      </svg>
    </div>
  </div>

  <script>
    // === IPC (Tauri v2 API) ===
    // Tauri v2: API at window.__TAURI__.core.invoke / window.__TAURI__.event.listen
    // Note: "ipc" is a reserved global in Tauri's WKWebView, so we use "ttipc"
    function getInvoke() {
      // Try Tauri v2 global API first, then internals (differs between dev/release)
      if (window.__TAURI__ && window.__TAURI__.core) return window.__TAURI__.core.invoke;
      if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) return window.__TAURI_INTERNALS__.invoke;
      return null;
    }
    function getListen() {
      if (window.__TAURI__ && window.__TAURI__.event) return window.__TAURI__.event.listen;
      if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.listen) return window.__TAURI_INTERNALS__.listen;
      return null;
    }

    const ttipc = {
      invoke(cmd, args) {
        const fn = getInvoke();
        if (!fn) { console.warn('[ipc] No invoke for:', cmd); return Promise.resolve(); }
        return fn(cmd, args);
      },
      listen(eventName, callback) {
        const fn = getListen();
        if (!fn) { console.warn('[ipc] No listen for:', eventName); return Promise.resolve(); }
        return fn(eventName, callback);
      },
      toggleRecording(isRecording) { return this.invoke('toggle_recording', { isRecording }); },
      openSettings() { return this.invoke('open_settings'); },
    };

    // === WIDGET STATE ===
    const widget = document.getElementById('widget');
    const timer = document.querySelector('.timer');
    const bars = document.querySelectorAll('.bar');
    let currentState = 'idle';
    let permissionsMissing = false;
    let timerInterval = null;
    let recordingStart = 0;

    function setState(s) {
      currentState = s;
      widget.className = 'widget ' + s;
      // Resize window: recording pill needs more width
      const w = (s === 'recording' || s === 'transcribing') ? 180 : 80;
      if (window.__TAURI__ && window.__TAURI__.window) {
        const win = window.__TAURI__.window.getCurrentWindow();
        win.setSize(new window.__TAURI__.dpi.LogicalSize(w, 80)).catch(() => {});
      } else {
        // Fallback for release mode via internal plugin command
        ttipc.invoke('plugin:window|set_size', {
          label: 'main',
          value: { type: 'Logical', data: { width: w, height: 80 } },
        }).catch(() => {});
      }
    }

    function startTimer() {
      recordingStart = Date.now();
      timer.textContent = '0.0s';
      timerInterval = setInterval(() => {
        timer.textContent = ((Date.now() - recordingStart) / 1000).toFixed(1) + 's';
      }, 100);
    }

    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

    const barWeights = [0.4, 0.55, 0.75, 0.9, 1.0, 0.9, 0.75, 0.55, 0.4];
    let smoothedLevel = 0;

    function updateWaveform(level) {
      const target = Math.min(level * 15, 1);
      smoothedLevel += (target - smoothedLevel) * 0.3;
      widget.style.setProperty('--level', smoothedLevel.toFixed(3));
      bars.forEach((b, i) => {
        const h = 4 + 24 * smoothedLevel * barWeights[i] * (0.7 + Math.random() * 0.3);
        b.style.height = Math.round(h) + 'px';
      });
    }

    function flashState(s, ms) {
      setState(s);
      setTimeout(() => setState('idle'), ms || 1500);
    }

    // === CLICK vs DRAG ===
    // On mousedown, wait briefly. If mouse moves >5px → drag the window.
    // If mouse releases without moving → toggle recording.
    let _dragState = null;

    widget.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      _dragState = { x: e.screenX, y: e.screenY, dragging: false };
    });

    document.addEventListener('mousemove', (e) => {
      if (!_dragState || _dragState.dragging) return;
      // Don't allow drag while recording — slight mouse movements would prevent stop
      if (currentState === 'recording') return;
      const dx = e.screenX - _dragState.x;
      const dy = e.screenY - _dragState.y;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        _dragState.dragging = true;
        if (window.__TAURI__ && window.__TAURI__.window) {
          window.__TAURI__.window.getCurrentWindow().startDragging().catch(() => {});
        } else {
          ttipc.invoke('plugin:window|start_dragging', { label: 'main' }).catch(() => {});
        }
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (!_dragState) return;
      const wasDrag = _dragState.dragging;
      _dragState = null;
      if (wasDrag) {
        // Save position after drag ends
        ttipc.invoke('save_window_position').catch(() => {});
        return;
      }

      // Treat as click — toggle recording (or open settings if permissions missing)
      if (currentState === 'idle') {
        if (permissionsMissing) {
          ttipc.openSettings();
        } else {
          ttipc.toggleRecording(false).catch(e2 => console.error('[toggle] start error:', e2));
        }
      } else if (currentState === 'recording') {
        ttipc.toggleRecording(true).catch(e2 => console.error('[toggle] stop error:', e2));
      }
    });

    // Right-click → settings
    widget.addEventListener('contextmenu', (e) => { e.preventDefault(); ttipc.openSettings().catch(() => {}); });

    // === SIDECAR EVENTS ===
    const listenFn = getListen();
    if (listenFn) {
      const L = (ev, fn) => ttipc.listen(ev, fn);
      L('sidecar:ready', () => console.log('[sidecar] ready'));
      L('sidecar:recording_started', () => { setState('recording'); startTimer(); });
      L('sidecar:audio_level', (e) => {
        if (currentState !== 'recording') return;
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        updateWaveform(d.level || 0);
      });
      L('sidecar:recording_stopped', () => { stopTimer(); smoothedLevel = 0; });
      L('sidecar:transcribing', () => { stopTimer(); bars.forEach(b => b.style.height = '4px'); setState('transcribing'); });
      L('sidecar:pasted', (e) => { flashState('success'); });
      L('sidecar:no_speech', () => { stopTimer(); flashState('error'); });
      L('sidecar:error', (e) => { stopTimer(); flashState('error'); });
      L('sidecar:crashed', () => { stopTimer(); flashState('error', 3000); });
      L('sidecar:permissions', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        const warn = document.getElementById('permWarning');
        permissionsMissing = !d.microphone || !d.accessibility;
        warn.style.display = permissionsMissing ? 'block' : 'none';
        console.log('[permissions] mic:', d.microphone, 'acc:', d.accessibility, 'missing:', permissionsMissing);
      });
      L('sidecar:device_changed', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        console.log('[device] changed:', d.name, 'inputs:', d.count);
      });

      // Server status events
      const serverDot = document.getElementById('serverStatus');
      L('server:starting', () => {
        serverDot.className = 'server-status starting';
        serverDot.title = 'Server starting...';
        serverDot.style.display = 'block';
      });
      L('server:ready', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        serverDot.className = 'server-status ready';
        serverDot.title = 'Server ready (port ' + (d.port || '?') + ')';
        // Hide after 3s — green dot served its purpose
        setTimeout(() => { serverDot.style.display = 'none'; }, 3000);
      });
      L('server:error', (e) => {
        const d = typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload;
        serverDot.className = 'server-status error';
        serverDot.title = 'Server error: ' + (d.reason || 'unknown');
        serverDot.style.display = 'block';
      });
    } else {
      console.warn('[widget] No Tauri event API — events will not work');
    }

    console.log('[widget] loaded');
  </script>
</body>
</html>
