<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakType Settings</title>
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div class="settings">
    <div class="title-row">
      <h1>SpeakType Settings</h1>
      <button class="info-btn" id="about-btn" title="About SpeakType">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="hotkey">Hotkey</button>
      <button class="tab" data-tab="server">Server</button>
      <button class="tab" data-tab="general">General</button>
      <button class="tab" data-tab="history">History</button>
    </div>

    <!-- Hotkey Tab -->
    <div class="tab-content active" id="tab-hotkey">
      <div class="field">
        <label>Current Hotkey</label>
        <div class="hotkey-display" id="current-hotkey">Loading...</div>
      </div>
      <div class="field">
        <label>Press new hotkey combination</label>
        <button class="hotkey-capture" id="capture-btn">Click to capture...</button>
        <p class="hint">Press the key combination you want to use, then click Save.</p>
      </div>
      <div class="field">
        <label>Or choose a preset</label>
        <div class="presets">
          <button class="preset" data-hotkey="CmdOrCtrl+Alt+L">Cmd+Option+L</button>
          <button class="preset" data-hotkey="CmdOrCtrl+Shift+Space">Cmd+Shift+Space</button>
          <button class="preset" data-hotkey="F9">F9</button>
          <button class="preset" data-hotkey="F8">F8</button>
        </div>
      </div>
    </div>

    <!-- Server Tab -->
    <div class="tab-content" id="tab-server">
      <div class="field">
        <label>API URL</label>
        <div class="url-row">
          <input type="text" id="api-url" placeholder="http://localhost:8003/transcribe">
          <span class="status-dot" id="server-status" title="Checking..."></span>
        </div>
        <p class="hint">Whisper-compatible transcription endpoint</p>
      </div>
      <div class="field">
        <label>Model</label>
        <select id="model-select">
          <option value="tiny">tiny</option>
          <option value="base" selected>base</option>
          <option value="small">small</option>
          <option value="medium">medium</option>
          <option value="large-v3">large-v3</option>
        </select>
      </div>
      <div class="field">
        <label>Language</label>
        <select id="language-select">
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="nl">Dutch</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="ar">Arabic</option>
          <option value="hi">Hindi</option>
          <option value="ru">Russian</option>
        </select>
      </div>
      <button class="btn" id="check-server-btn">Check Connection</button>
    </div>

    <!-- General Tab -->
    <div class="tab-content" id="tab-general">
      <div class="field">
        <label>Permissions</label>
        <div class="permissions-list">
          <div class="permission-row">
            <span class="permission-label">Microphone</span>
            <span class="permission-status" id="perm-mic">Checking...</span>
          </div>
          <div class="permission-row">
            <span class="permission-label">Accessibility</span>
            <span class="permission-status" id="perm-acc">Checking...</span>
            <button class="btn secondary btn-small" id="request-acc-btn" style="display:none">Grant</button>
          </div>
        </div>
        <p class="hint">Microphone is needed for recording. Accessibility is needed to paste text into other apps.</p>
      </div>
      <div class="field">
        <button class="btn secondary" id="reset-position-btn">Reset Widget Position</button>
      </div>
    </div>

    <!-- History Tab -->
    <div class="tab-content" id="tab-history">
      <div class="history-list" id="history-list">
        <div class="history-empty" id="history-empty">No transcriptions yet</div>
      </div>
      <div class="history-actions">
        <button class="btn secondary" id="clear-history-btn">Clear History</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn primary" id="save-btn">Save</button>
    </div>
  </div>

  <script src="scripts/ipc.js"></script>
  <script src="scripts/settings.js"></script>
</body>
</html>
