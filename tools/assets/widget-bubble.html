<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpeakType Widget Bubble</title>
  <link rel="stylesheet" href="../../apps/widget/web/styles/theme.css">
  <link rel="stylesheet" href="../../apps/widget/web/styles/widget.css">
  <style>
    .snapshot .widget,
    .snapshot .check-icon,
    .snapshot .error-icon,
    .snapshot .dot,
    .snapshot .waveform::before {
      animation: none !important;
    }
    .snapshot .widget {
      transition: none !important;
    }
    .snapshot .check-icon,
    .snapshot .error-icon {
      stroke-dashoffset: 0 !important;
    }

    .snapshot .dots-wave .dot:nth-child(1) {
      opacity: 1;
      transform: scale(1.3);
    }
    .snapshot .dots-wave .dot:nth-child(2) {
      opacity: 0.65;
      transform: scale(1.05);
    }
    .snapshot .dots-wave .dot:nth-child(3) {
      opacity: 0.3;
      transform: scale(0.8);
    }

    .snapshot .widget.glow-medium.success {
      box-shadow:
        0 0 20px rgba(74, 222, 128, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .snapshot .widget.glow-medium.error {
      box-shadow:
        0 0 18px rgba(248, 113, 60, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    html, body {
      width: 240px;
      height: 120px;
      background: transparent;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 272px;
      min-height: 56px;
      transform-origin: center center;
    }
  </style>
</head>
<body class="snapshot">
  <div class="stage">
    <div id="widget" class="widget idle">
      <div class="state-idle">
        <div class="icon-container">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </div>
      </div>
      <div class="state-recording">
        <button type="button" class="rec-btn rec-cancel" title="Cancel" aria-label="Cancel recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M6 6l12 12M18 6l-12 12"/>
          </svg>
        </button>
        <div class="waveform" aria-hidden="true">
          <canvas id="wave-canvas" class="wave-canvas" width="136" height="30"></canvas>
        </div>
        <span class="timer">3.2s</span>
        <button type="button" class="rec-btn rec-stop" title="Stop and transcribe" aria-label="Stop recording">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>
      </div>
      <div class="state-transcribing">
        <div id="dots" class="dots dots-wave">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
      <div class="state-success">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12.75l6 6 9-13.5"/>
        </svg>
      </div>
      <div class="state-error">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round">
          <path d="M6 6l12 12M18 6l-12 12"/>
        </svg>
      </div>
    </div>
  </div>
  <script src="../../apps/widget/web/scripts/waveform.js"></script>
  <script>
    const RECORDING_LEVEL = 0.735;
    const FIT_MARGIN = 20;
    const WAVE_AMPS = [
      0.18, 0.32, 0.45, 0.28, 0.52, 0.68, 0.41, 0.26, 0.38,
      0.58, 0.74, 0.86, 0.62, 0.44, 0.31, 0.47, 0.66, 0.83,
      0.95, 0.72, 0.55, 0.38, 0.50, 0.69, 0.88, 0.76, 0.58,
    ];

    const params = new URLSearchParams(location.search);
    const state = params.get('state') || 'idle';
    const stage = document.querySelector('.stage');
    const widget = document.getElementById('widget');

    widget.className = 'widget ' + state;

    if (state === 'recording') {
      widget.style.setProperty('--level', String(RECORDING_LEVEL));
      const wave = new WaveformRenderer(document.getElementById('wave-canvas'));
      WAVE_AMPS.forEach((amp) => wave.push(amp));
      wave.draw(0);
    }

    if (state === 'success') {
      const check = document.querySelector('.check-icon');
      if (check) check.style.stroke = '#4ade80';
      widget.classList.add('glow-medium');
    }

    if (state === 'error') {
      const x = document.querySelector('.error-icon');
      if (x) x.style.stroke = '#ef4444';
      widget.classList.add('glow-medium');
    }

    const needed = widget.getBoundingClientRect().width + FIT_MARGIN * 2;
    const room = document.body.clientWidth;
    if (needed > room) stage.style.transform = 'scale(' + (room / needed).toFixed(4) + ')';
  </script>
</body>
</html>
